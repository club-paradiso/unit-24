[project]
name = "radiocorpus"
version = "0.1.0"
description = "US Public Safety Radio Protocol Corpus: provenance-first research data layer"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx[socks]>=0.27",
    "jsonschema>=4.22",
    "pydantic>=2.7",
    "pypdf>=4.2",
    "rapidfuzz>=3.9",
    "rich>=13",
    "selectolax>=0.3",
    "typer>=0.12",
]

[project.scripts]
radiocorpus = "radiocorpus.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "B008"]
[tool.ruff.lint.per-file-ignores]
"src/radiocorpus/report.py" = ["E501"]
"src/radiocorpus/eligibility/policy.py" = ["E501"]
"scripts/make_fixtures.py" = ["E501"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
