name: Corpus checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync
      - run: uv run pytest
      - run: uv run ruff check src tests scripts
      - run: uv run radiocorpus check-invariants

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  firestore-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx -y firebase-tools@15.31.0 emulators:exec --only firestore --project demo-unit24 'npx vitest run --config vitest.rules.config.ts'

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Find successful Preview for this exact commit
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            for (let attempt = 0; attempt < 36; attempt++) {
              const { data } = await github.rest.repos.listDeployments({ ...context.repo, sha, per_page: 30 });
              for (const deployment of data.filter(d => !d.production_environment)) {
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({ ...context.repo, deployment_id: deployment.id });
                const status = statuses[0];
                if (status?.state === 'success' && status.environment_url) {
                  const url = new URL(status.environment_url);
                  if (url.protocol !== 'https:' || !url.hostname.endsWith('.vercel.app')) throw new Error('Unexpected Preview host');
                  core.setOutput('url', url.origin);
                  core.info(`Preview commit ${sha}: ${url.origin}`);
                  return;
                }
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('No successful Preview for the exact PR head; do not merge without deployment verification.');
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test --workers=2
        env:
          E2E_BASE_URL: ${{ steps.preview.outputs.url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-playwright-report
          path: web/playwright-report
          retention-days: 7
